services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: bin/rails server -b 0.0.0.0 -p 3000
    ports:
      - "4000:3000"
    environment:
      - RAILS_ENV=development
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - PISTON_URL=http://piston:2000
      - SOLID_QUEUE_IN_PUMA=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/v1/stages || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      piston:
        condition: service_healthy
    volumes:
      - ./backend:/rails
      - ./tests:/rails/tests:ro

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: droid_backend_development
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  piston:
    build:
      context: ./piston
      dockerfile: Dockerfile
    restart: always
    privileged: true
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - PISTON_RUN_TIMEOUT=30000
      - PISTON_COMPILE_TIMEOUT=30000
      - PISTON_RUN_CPU_TIME=25000
      - PISTON_COMPILE_CPU_TIME=25000
      - PISTON_OUTPUT_MAX_SIZE=65536
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:2000/api/v2/runtimes',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{const a=JSON.parse(d);process.exit(a.length>=6?0:1)})}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s
    expose:
      - "2000"
    volumes:
      - piston_data:/piston

volumes:
  postgres_data:
  piston_data:
