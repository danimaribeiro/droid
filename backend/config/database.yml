default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV.fetch("DATABASE_URL") { "postgres://postgres:password@localhost:5432/droid_backend_development" } %>

development:
  <<: *default

test:
  <<: *default
  database: droid_backend_test

production:
  <<: *default
